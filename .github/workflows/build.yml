name: build

on:
  push:
    branches: [ dev, rel/* ]
    tags: [ '*' ]
  pull_request:
    branches: [ dev, rel/* ]
  workflow_dispatch:

env:
  DOTNET_MULTILEVEL_LOOKUP: 0
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: 1
  NUGET_XMLDOC_MODE: skip
  TERM: xterm

permissions:
  contents: read

jobs:
  build:
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ macos-26, ubuntu-24.04, windows-2022 ]
        include:
          - os: macos-26
            os_name: macos
          - os: ubuntu-24.04
            os_name: linux
          - os: windows-2022
            os_name: windows

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Build
      if: ${{ runner.os == 'Windows' }}
      run: eng\common\Build.cmd -configuration Release -ci -prepareMachine -restore -build -integrationTest

    - name: Build
      if: ${{ runner.os != 'Windows' }}
      shell: pwsh
      run: ./eng/common/build.sh -configuration Release -ci -prepareMachine -restore -build -integrationTest
