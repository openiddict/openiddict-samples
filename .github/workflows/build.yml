name: build

on:
  push:
    branches: [ dev ]
    tags: [ '*' ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:

env:
  DOTNET_MULTILEVEL_LOOKUP: 0
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: 1
  NUGET_XMLDOC_MODE: skip
  TERM: xterm

permissions:
  contents: read

jobs:
  build:
    name: build-${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ xcode-27, ubuntu-24.04, windows-2022 ]
        include:
        - os: xcode-27
          os_name: macos
        - os: ubuntu-24.04
          os_name: linux
        - os: windows-2022
          os_name: windows

    steps:
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Select Xcode 27.2
      if: runner.os == 'macOS'
      shell: bash
      run: |
        export DEVELOPER_DIR=/Applications/Xcode_27.2.app/Contents/Developer
        xcodebuild -version
        echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"

    - name: Set up .NET SDK
      uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
      with:
        global-json-file: global.json

    - name: Restore dependencies
      shell: pwsh
      run: dotnet restore --artifacts-path artifacts -p:Configuration=Release

    - name: Build solution
      run: dotnet build --configuration Release --no-restore --artifacts-path artifacts -bl:artifacts/log/Release/build.binlog

    - name: Publish logs
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: logs-${{ matrix.os_name }}
        path: ./artifacts/log/Release
